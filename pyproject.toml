[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeinvest"
version = "0.1.0"
description = "Reproducible SafeInvest MCM modeling project"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
